    </linearGradient>
    <linearGradient id="grad-dt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCE7F3"/><stop offset="100%" stop-color="#F9D5E7"/>
    </linearGradient>
  </defs>

  <!-- ===== 标题 ===== -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A1A">Pointer · AI Workstation — Architecture</text>

  <!-- ===== 第一层: 用户入口 ===== -->
  <rect x="200" y="60" width="700" height="72" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
