# input.schema.yaml — flat input tool schemas (no method enum)

input_index:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    index:
      type: integer
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    use_clipboard:
      type: boolean
      description: Default true. Writes text to clipboard and pastes via Cmd+V/Ctrl+V, bypassing IME. Set false to fall back to character-by-character keyboard events (enigo.text).
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - index
    - text
    - goal
  additionalProperties: true

input_at:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    x:
      type: number
    y:
      type: number
    text:
