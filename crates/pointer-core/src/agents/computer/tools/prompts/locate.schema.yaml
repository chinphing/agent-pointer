locate_element:
  type: object
  properties:
    goal:
      type: string
      description: >
        **Required.** What this locate call is for (e.g. 输入股票代码查询行情).
        Used twice: to pick the element that actually serves the purpose when
        several look alike, and at verify time — if the purpose is served, a
        small visual discrepancy (box not fully covering the target) still counts
        as correct. One goal is shared by the whole call.
    elements:
      type: array
      minItems: 1
      maxItems: 3
      description: >
        The elements to locate, returned in order. Every entry must already exist
        on the current screen; do not pre-locate something that only appears after
        a click — it is not in the image yet and the call will fail. When order
        matters, split into several calls.
        Three per call maximum; more is rejected by argument validation (never
        silently truncated).
      items:
        type: object
        properties:
          description:
            type: string
            description: >
              What the target element is. Four parts: appearance (shape/colour/text),
              control type (button/icon/menu item/text label/input field),
              screen position (which region), and an anchor (what sits next to it,
              true only for this target).
              Example: 地址栏右侧的圆形按钮，蓝色箭头图标，紧邻刷新按钮.
          hint_box:
            type: array
            items:
              type: number
            minItems: 4
            maxItems: 4
            description: >
              Optional. Your estimated target box [x1, y1, x2, y2], four logical
              pixel values. With a hint, full-screen grounding is skipped and the
              call starts from crop verification, saving one vision call. A hint
              cannot bypass verification or lower the bar for a match. Omit it if
              you are unsure.
        required:
          - description
        additionalProperties: false
  required:
    - goal
    - elements
  additionalProperties: false
