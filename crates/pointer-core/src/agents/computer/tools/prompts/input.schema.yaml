# input.schema.yaml — flat input tool schemas (no method enum)

input_at:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    x:
      type: number
      description: >
        Logical screen pixel X. For a visible target this MUST come
        from a successful `locate_element` result; do not estimate
        coordinates off a screenshot.
    y:
      type: number
      description: >
        Logical screen pixel Y. For a visible target this MUST come
        from a successful `locate_element` result; do not estimate
        coordinates off a screenshot.
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    use_clipboard:
      type: boolean
      description: Default true. Writes text to clipboard and pastes via Cmd+V/Ctrl+V, bypassing IME. Set false to fall back to character-by-character keyboard events (enigo.text).
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - x
    - y
    - text
    - goal
  additionalProperties: true

input_focused:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    use_clipboard:
      type: boolean
      description: Default true. Writes text to clipboard and pastes via Cmd+V/Ctrl+V, bypassing IME. Set false to fall back to character-by-character keyboard events (enigo.text).
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - text
    - goal
  additionalProperties: true
