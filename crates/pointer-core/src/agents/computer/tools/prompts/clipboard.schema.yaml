# `action` 不在本文件声明：desktop 工具共有的这个字段由 tools/mod.rs 的
# inject_action_field 统一注入结构（type + required）。字段该写什么，权威在
# ../prompts/communication.md 的 `## Tool call shape`。
clipboard_read:
  description: "Read the current clipboard text."
  type: object
  properties:
  required:
  additionalProperties: false

clipboard_write:
  description: "Put text on the clipboard."
  type: object
  properties:
    text:
      type: string
      description: "The text to place on the clipboard."
  required:
    - text
  additionalProperties: false
