mouse_click_at:
  type: object
  properties:
    target_desc:
      type: string
      description: "要点的东西是什么。写全四要素：外观特征 + 控件类型 + 屏幕位置 + 周边锚点。例：搜索框右侧的橙色圆角按钮，白色文字「查行情」，紧邻「进股吧」按钮。必须和 bbox 一起给。"
    bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "目标大概在 [x1, y1, x2, y2]，逻辑像素。通常直接用上一步 locate_element 返回的 bbox。工具会以此为搜索种子重新定位确认，再点确认后的中心——所以框粗一点没关系，但必须和 target_desc 一起给。"
    goal:
      type: string
    action:
      type: string
    button:
      type: string
      enum:
        - left
        - middle
        - right
      description: Mouse button. Default left.
    clicks:
      type: integer
      minimum: 1
      maximum: 2
      description: Number of clicks (1 or 2). Default 1.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - target_desc
    - bbox
    - goal
  additionalProperties: true

