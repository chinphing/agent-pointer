[package]
name = "pointer-license-gen"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "license-gen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
pointer-core = { path = "../../crates/pointer-core" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
