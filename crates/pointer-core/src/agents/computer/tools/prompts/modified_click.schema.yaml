modified_click_select_at:
  type: object
  properties:
    action:
      type: string
      description: "What this call is for, one clause, in the user's language — 「打开聊天标题栏的更多菜单」. This is the card title and the anchor verify judges against."
    positions:
      type: array
      description: "One entry per target to select. Each is grounded and confirmed before any click happens."
      items:
        type: object
        properties:
          target_desc:
            type: string
            description: "What this target is. Required together with bbox. See Writing target_desc for the shape."
          bbox:
            type: array
            items:
              type: number
            minItems: 4
            maxItems: 4
            description: "Target box, [x1, y1, x2, y2] in screenshot pixels. See Locating targets."
        required:
          - target_desc
          - bbox
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - positions
    - action
  additionalProperties: true

