[package]
name = "pointer-cli"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
edition = "2021"
description = "Headless, GUI-free CLI runner for the Pointer agent runtime"
publish = false

[[bin]]
name = "pointer-cli"
path = "src/main.rs"

[features]
default = ["computer"]
# Mirrors `pointer-core`'s `computer` feature: enabling it links the desktop
# GUI backends (enigo / xcap / arboard). Build with `--no-default-features` for
# a headless binary with no X11 / GBM / pipewire shared-library dependency.
computer = ["pointer-core/computer"]

[dependencies]
pointer-core = { path = "../pointer-core", default-features = false }
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
