composite_type_text_index:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    index:
      type: integer
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    human_like:
      type: boolean
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - index
    - text
    - goal
  additionalProperties: true

