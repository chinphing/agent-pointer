# file.schema.yaml — 独立工具 schema（不含 method 枚举）
# 从 file.md 的 YAML front matter 拆分出来，每个平铺工具一个 key。
# 提示词正文仍留在 file.md 中共享。

file_read:
  type: object
  properties:
    path:
      type: string
    file:
      type: string
    offset:
      type: integer
      minimum: 1
      default: 1
      description: 1-based first line to read (JSON integer, unquoted). Default 1.
    limit:
      type: integer
      minimum: 1
      maximum: 2000
      default: 500
      description: Max lines to return from offset (JSON integer, unquoted). Default 500, ceiling 2000.
    maxBytes:
      type: integer
  required: [path]
  additionalProperties: false

file_write:
  type: object
  properties:
    path:
      type: string
    content: {}
  required: [path, content]
  additionalProperties: true

file_edit:
  type: object
  properties:
    path:
      type: string
    file:
      type: string
    oldString:
      type: string
    newString:
      type: string
  required: [path, oldString, newString]
  additionalProperties: true

file_glob:
  type: object
  properties:
    pattern:
      type: string
    base:
      type: string
    limit:
      type: integer
      minimum: 1
      maximum: 500
      default: 100
      description: Max matching paths to return (JSON integer, unquoted). Default 100, ceiling 500.
    maxDepth:
      type: integer
    entryType:
      type: string
      enum: [file, dir, all]
    includeHidden:
      type: boolean
  required: [pattern]
  additionalProperties: false

file_grep:
  type: object
  properties:
    pattern:
      type: string
    path:
      type: string
    limit:
      type: integer
      minimum: 1
      maximum: 200
      default: 50
      description: Max matching rows to return (JSON integer, unquoted). Default 50, ceiling from host settings.
    maxDepth:
      type: integer
    contextLines:
      type: integer
    includeGlobs:
      type: array
      items:
        type: string
    excludeGlobs:
      type: array
      items:
        type: string
    fileTypes:
      type: array
      items:
        type: string
    fixedString:
      type: boolean
    ignoreCase:
      type: boolean
    includeHidden:
      type: boolean
  required: [pattern, path]
  additionalProperties: true

file_list:
  type: object
  properties:
    path:
      type: string
    recursive:
      type: boolean
    maxDepth:
      type: integer
    limit:
      type: integer
      minimum: 1
      maximum: 2000
      default: 100
      description: Max directory entries to return (JSON integer, unquoted). Default 100, ceiling 2000.
    entryType:
      type: string
      enum: [all, file, dir]
  required: [path]
  additionalProperties: false
