# task_board.schema.yaml — flat tool argument shapes (v4)
# Narrative guidance lives in task_board.md.

task_board_init:
  type: object
  properties:
    goal:
      type: string
    context:
      type: string
    constraint:
      type: string
    done_when:
      type: string
    global_milestones:
      description: >
        Task-level milestone array (or JSON string).
        Type1: 3-12 steps. Type2: g_plan, g_exec, g_deliver.
    item_milestones:
      description: >
        Per-work-item SOP template (Type2 only). Use {field} placeholders.
    work_items:
      description: Inline work item drafts (Type2 enumerated init).
    work_items_source:
      type: string
      description: >
        Path or media ref to seed work_items from CSV/JSONL/XLSX (Type2).
        Accepts localPath, pointer-media://…, or storage rel (same as general agent media).
    work_item_mode:
      type: string
      enum: [enumerated, dynamic]
    expected_total:
      type: integer
      minimum: 1
    dynamic_quota:
      type: integer
      minimum: 1
    global_context: {}
    items:
      description: Legacy alias for global_milestones.
    _conversation_id:
      type: string
  required: [goal]
  additionalProperties: true

task_board_replace:
  type: object
  properties:
    item_milestones:
      description: Full item SOP template array (execution only).
    _conversation_id:
      type: string
  required: [item_milestones]
  additionalProperties: false

task_board_patch:
  type: object
  properties:
    global_milestones:
      description: Exactly one global row (mutually exclusive with milestones).
    milestones:
      description: Exactly one item_milestone row (Type2, mutually exclusive with global_milestones).
    work_item_delta: {}
    work_item_claim: {}
    items:
      description: Legacy flat row (id + status); prefer global_milestones or milestones.
    item_id:
      type: string
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_prune:
  type: object
  properties:
    ids:
      type: array
      items:
        type: string
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_finalize:
  type: object
  properties:
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_sync_finding:
  type: object
  properties:
    finding:
      type: string
    _conversation_id:
      type: string
  required: [finding]
  additionalProperties: true

task_board_check_deps:
  type: object
  properties:
    item_id:
      type: string
    _conversation_id:
      type: string
  required: [item_id]
  additionalProperties: true
