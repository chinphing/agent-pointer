mouse_click_at:
  type: object
  properties:
    target_desc:
      type: string
      description: "What you want to act on. Required together with bbox. See Writing target_desc for the shape."
    bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "Target box, [x1, y1, x2, y2] in screenshot pixels. See Locating targets."
    goal:
      type: string
    action:
      type: string
      description: "This call's purpose as a visible effect — 「打开聊天标题栏的更多菜单」. Verify judges against this, not `goal`. One clause."
    button:
      type: string
      enum:
        - left
        - middle
        - right
      description: Mouse button. Default left.
    clicks:
      type: integer
      minimum: 1
      maximum: 2
      description: Number of clicks (1 or 2). Default 1.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - target_desc
    - bbox
    - goal
    - action
  additionalProperties: true

