  <text x="320" y="114" text-anchor="middle" font-size="11" fill="#0C447C">Desktop (Tauri)</text>
  <rect x="440" y="96" width="140" height="26" rx="6" fill="url(#grad-fs)" stroke="#185FA5" stroke-width="1"/>
  <text x="510" y="114" text-anchor="middle" font-size="11" fill="#0C447C">Web (Vite)</text>
