[package]
name = "pointer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "5"
futures-util = "0.3"
log = "0.4"
parking_lot = "0.12"

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util"] }

tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
globset = "0.4"
walkdir = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"

