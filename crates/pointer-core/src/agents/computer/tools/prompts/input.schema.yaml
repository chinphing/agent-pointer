# input.schema.yaml — flat input tool schemas (no method enum)

input_at:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    target_desc:
      type: string
      description: "Which control to type into. Four parts: appearance + control type + screen position + anchor. Example: search field at the top of the dialog, grey border, placeholder 'Search files'. Required together with bbox."
    bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "Roughly where the control is, [x1, y1, x2, y2] in 0-1000 normalized coordinates. The tool re-grounds inside it before clicking into the field."
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - target_desc
    - bbox
    - text
    - goal
  additionalProperties: true

input_focused:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - text
    - goal
  additionalProperties: true
