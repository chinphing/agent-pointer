# skill.schema.yaml — 独立工具 schema（不含 method 枚举）
# 提示词正文仍留在 skill.md 中共享。

skill_read:
  type: object
  properties:
    skill_id:
      type: string
    path:
      type: string
      description: >-
        Required. Use SKILL.md for instructions (layer 2).
        Use a resource-relative path (e.g. references/guide.md) for bundled files (layer 3).
  required: [skill_id, path]
  additionalProperties: false

skill_import:
  type: object
  properties:
    path:
      type: string
      description: Path to a .zip file or skill directory (absolute or workspace-relative).
    auto_enable:
      type: boolean
      description: Enable imported skills on the current lead. Defaults to true.
  required: [path]
  additionalProperties: false
