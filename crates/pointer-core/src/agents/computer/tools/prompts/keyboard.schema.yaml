# keyboard.schema.yaml — flat keyboard tool schemas (PRESS / KEY_DOWN / KEY_UP / TYPING)

key_press:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
      description: "This call's purpose as a visible effect — 「打开聊天标题栏的更多菜单」. Verify judges against this, not `goal`. One clause."
    key:
      type: string
      description: Key name, e.g. enter, tab, escape, up, space, a.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
    - goal
    - action
  additionalProperties: true

key_down:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
      description: "This call's purpose as a visible effect — 「打开聊天标题栏的更多菜单」. Verify judges against this, not `goal`. One clause."
    key:
      type: string
      description: Key name to hold down until a later key_up.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
    - goal
    - action
  additionalProperties: true

key_up:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
      description: "This call's purpose as a visible effect — 「打开聊天标题栏的更多菜单」. Verify judges against this, not `goal`. One clause."
    key:
      type: string
      description: Key name to release.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
    - goal
    - action
  additionalProperties: true

keyboard_type:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
      description: "This call's purpose as a visible effect — 「打开聊天标题栏的更多菜单」. Verify judges against this, not `goal`. One clause."
    text:
      type: string
      description: Text to type into the focused widget with raw key events.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - text
    - goal
    - action
  additionalProperties: true
