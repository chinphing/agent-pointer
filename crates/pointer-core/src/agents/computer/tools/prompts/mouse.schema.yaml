mouse_scroll_current:
  type: object
  properties:
    target_desc:
      type: string
      description: "Optional. What to scroll — the panel or list body that must move. When given, the tool grounds it and moves the pointer there before scrolling, because wheel events only reach the window under the pointer. Four parts: appearance + control type + screen position + anchor. Omit only when the pointer is already inside the panel."
    bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "Roughly where that panel is, [x1, y1, x2, y2] in logical pixels. Usually the bbox returned by locate_element. The tool re-grounds inside it and moves the pointer to the confirmed centre, so a loose box is fine — and the point it settles on may differ from the box you passed, because the locator re-finds the panel from target_desc. Required together with target_desc."
    goal:
      type: string
    action:
      type: string
    notches_x:
      type: integer
      minimum: -100
      maximum: 100
      description: >
        Horizontal scroll in wheel notches. Positive = right, negative = left.
        Omit when only vertical movement is needed.
    notches_y:
      type: integer
      minimum: -100
      maximum: 100
      description: >
        Vertical scroll in wheel notches. Positive = up, negative = down.
        Omit when only horizontal movement is needed. Most page scrolls need
        10-40; 100 jumps far. The distance one notch covers depends on the app —
        read the previous scroll's result to learn how far your last scroll went.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - goal
  additionalProperties: true

