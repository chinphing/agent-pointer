mouse_click_at:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    x:
      type: number
      description: >
        Logical screen pixel X. For a visible target this MUST come
        from a successful `locate_element` result; do not estimate
        coordinates off a screenshot.
    y:
      type: number
      description: >
        Logical screen pixel Y. For a visible target this MUST come
        from a successful `locate_element` result; do not estimate
        coordinates off a screenshot.
    button:
      type: string
      enum:
        - left
        - middle
        - right
      description: Mouse button. Default left.
    clicks:
      type: integer
      minimum: 1
      maximum: 2
      description: Number of clicks (1 or 2). Default 1.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - x
    - y
    - goal
  additionalProperties: true

