    <rect x="356" y="398" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#E5E5E8"/>
    <text x="388" y="415" font-size="11" fill="#52525B" text-anchor="middle">指定</text>
    <line x1="284" y1="448" x2="756" y2="448" stroke="#E5E5E8"/>
    <text x="284" y="472" font-size="10" fill="#71717A">Key 加密后存服务端，员工端与浏览器都拿不到明文。</text>
    <text x="284" y="490" font-size="10" fill="#71717A">加密材料绑定本机：换机或迁移后需重新录入。</text>
    <rect x="612" y="508" width="68" height="32" rx="8" fill="#FFFFFF" stroke="#E5E5E8"/>
    <text x="646" y="529" font-size="11" fill="#52525B" text-anchor="middle">取消</text>
    <rect x="692" y="508" width="64" height="32" rx="8" fill="#0071EB"/>
    <text x="724" y="529" font-size="11" fill="#FFFFFF" text-anchor="middle">保存</text>
