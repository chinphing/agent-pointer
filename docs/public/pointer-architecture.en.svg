      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.3"/>
    </marker>
    <linearGradient id="grad-fs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6F1FB"/><stop offset="100%" stop-color="#D9E8FA"/>
    </linearGradient>
    <linearGradient id="grad-be" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF2E6"/><stop offset="100%" stop-color="#FFE8D5"/>
    </linearGradient>
