# Local branding smoke-test for pointer-server.
# Standalone + local password so you are not forced through cloud OAuth.
#
# Prefer an isolated app_data_dir (copy of PointerApp user_settings / API keys)
# so desktop PointerApp does not lock conversations.db. Example macOS:
#   app_data_dir = "/Users/YOU/Library/Application Support/PointerAppBrandingDev"
# Docs: docs/zh-CN/developer/standalone-deployment.md · docs/zh-CN/ui/web-branding-welcome-elapsed.md
#
# Start server:
#   POINTER_SERVER_CONFIG="$(pwd)/server/pointer-server.branding-dev.toml" \
#   POINTER_LICENSE_KEY="$(cat /tmp/pointer-branding-dev/license.txt)" \
#   POINTER_LICENSE_PUBLIC_KEY="$(cat /tmp/pointer-branding-dev/pub.txt)" \
#   npm run server:dev
#
# Login (Web): set username + generate password_hmac, then enter that password + captcha
#
# Tip UI — empty VITE_WEB_API_BASE uses Vite /api proxy (same-origin cookies):
#   VITE_WEB_API_BASE= \
#   VITE_WELCOME_TIP_TITLE="我是 Acme AI 助手" \
#   VITE_WELCOME_TIP_BODY="提交附件后我会自动处理，预计 10–30 分钟，期间您可以离开，完成后回来确认即可。" \
#   VITE_TURN_ELAPSED_ACTIVE="任务处理中" \
#   VITE_TURN_ELAPSED_DONE="任务已完成" \
#   npm run web:dev
# Open http://localhost:1420 — do not mix localhost page with
# VITE_WEB_API_BASE=http://127.0.0.1:8787 (CORS is off by default;
# that pair is also cross-site so the session cookie is dropped).

[deployment]
mode = "standalone"

[auth.local]
username = "admin"
hmac_secret = "replace-with-long-random-secret"
# pointer-server --hash-password --secret '<hmac_secret>' '<password>'
password_hmac = "replace-with-hmac-from-hash-password"

[usage]
report_enabled = false

[server]
addr = "127.0.0.1:8787"
# Uncomment and point at an isolated data dir when desktop PointerApp is also open:
# app_data_dir = "/Users/YOU/Library/Application Support/PointerAppBrandingDev"
page_title = "Acme · AI 助手"
composer_placeholder = "有什么可以帮你？"
welcome_tip_title = "我是 Acme AI 助手"
welcome_tip_body = "提交附件后我会自动处理，预计 10–30 分钟，期间您可以离开，完成后回来确认即可。"
turn_elapsed_active = "任务处理中"
turn_elapsed_done = "任务已完成"
