[package]
name = "pointer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
chrono = "0.4"
dirs = "5"
flexi_logger = "0.29"
futures-util = "0.3"
log = "0.4"
parking_lot = "0.12"

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util"] }
enigo = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"
base64 = "0.22"
xcap = "0.9"

tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
globset = "0.4"
walkdir = "2"
regex = "1"
quick-xml = "0.37"
scraper = "0.23"
async-trait = "0.1"
arboard = "3"

[dev-dependencies]
anyhow = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# Same Quartz coordinate space as xcap (`CGDisplayBounds` / `CGGetDisplaysWithPoint`). Enigo's macOS
# `location()` mixes NSEvent points with the main display's physical pixel height and can miss every display.
core-graphics = "0.23"
# Enigo uses TIS / event APIs that must run on the main thread; dispatch tool work there from Tokio workers.
dispatch = "0.2"
libc = "0.2"

