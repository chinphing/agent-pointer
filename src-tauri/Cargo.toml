[package]
name = "pointer-app"
version = "0.1.0"
description = "Pointer AI desktop chat client"
authors = ["pointer"]
edition = "2021"

[lib]
name = "pointer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
pointer-core = { path = "../crates/pointer-core" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSButton"] }
objc2-foundation = "0.3"
