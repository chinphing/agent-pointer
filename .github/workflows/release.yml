# One tag builds both client flavours and both server flavours for
# Windows, macOS, and Linux.
#
# community: no control plane, no updater artifacts.
# official: POINTER_EDITION=managed and Pointer's readflowai hosts.
#   The updater private key stays in GitHub secrets
#   TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#   It is not stored in this file.
#
# Uploaded names carry `_community` / `_official` or
# `pointer-server-community` / `pointer-server-official`.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauri_args: --target universal-apple-darwin
          - platform: ubuntu-24.04
            tauri_args: ""
          - platform: windows-latest
            tauri_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libfuse2 \
            squashfs-tools \
            patchelf \
            zsync \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libgtk-3-bin \
            libgdk-pixbuf-2.0-dev \
            librsvg2-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libdrm-dev \
            libwayland-dev \
            dpkg

      - name: Install frontend dependencies
        run: npm install

      - name: Generate app icons
        run: npm run icons

      - name: Clear bundle output
        run: |
          rm -rf \
            target/release/bundle \
            target/universal-apple-darwin/release/bundle \
            target/release/pointer-server-bundle \
            release-assets
          mkdir -p release-assets

      - name: Build community client
        run: npm run tauri:build -- ${{ matrix.tauri_args }}
        env:
          POINTER_PACKAGE_LABEL: community
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}

      - name: Stage community client
        run: node scripts/rename-release-assets.mjs --flavor community --dest release-assets

      - name: Clear bundle output before official client
        run: |
          rm -rf \
            target/release/bundle \
            target/universal-apple-darwin/release/bundle \
            target/release/pointer-server-bundle

      - name: Require official updater signing secrets
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "Official client builds need repository secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build official client
        run: npm run tauri:build -- ${{ matrix.tauri_args }}
        env:
          POINTER_PACKAGE_LABEL: official
          POINTER_EDITION: managed
          VITE_POINTER_EDITION: managed
          POINTER_API_BASE: https://pointer-api.readflowai.com
          POINTER_WEB_BASE: https://pointer.readflowai.com
          VITE_POINTER_WEB_BASE: https://pointer.readflowai.com
          COMPUTER_ANNOTATE_API_BASE: https://pointer-som.readflowai.com
          POINTER_DOWNLOAD_URL: https://pointer.readflowai.com/download
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}

      - name: Stage official client
        run: node scripts/rename-release-assets.mjs --flavor official --dest release-assets

      - name: Clear bundle output before community server
        run: |
          rm -rf \
            target/release/bundle \
            target/universal-apple-darwin/release/bundle \
            target/release/pointer-server-bundle

      - name: Build community server
        run: npm run server:build
        env:
          POINTER_PACKAGE_LABEL: community

      - name: Stage community server
        run: node scripts/rename-release-assets.mjs --flavor community --dest release-assets

      - name: Clear bundle output before official server
        run: |
          rm -rf \
            target/release/bundle \
            target/release/pointer-server-bundle

      - name: Build official server
        run: npm run server:build
        env:
          POINTER_PACKAGE_LABEL: official
          POINTER_EDITION: managed
          VITE_POINTER_EDITION: managed
          POINTER_API_BASE: https://pointer-api.readflowai.com
          POINTER_WEB_BASE: https://pointer.readflowai.com
          VITE_POINTER_WEB_BASE: https://pointer.readflowai.com
          COMPUTER_ANNOTATE_API_BASE: https://pointer-som.readflowai.com
          POINTER_DOWNLOAD_URL: https://pointer.readflowai.com/download

      - name: Stage official server
        run: node scripts/rename-release-assets.mjs --flavor official --dest release-assets

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          name: Pointer ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          draft: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            Community packages are unbound: bring your own model Base URL and API key. They have no updater.
            Official packages bind the readflowai control plane and require a Pointer account. Client updater artifacts are signed.
            Server packages are the zip (and a Linux deb). Names contain `community` or `official`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
