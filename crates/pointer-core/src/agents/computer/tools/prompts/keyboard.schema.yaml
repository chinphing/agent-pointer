# keyboard.schema.yaml — flat keyboard tool schemas (PRESS / KEY_DOWN / KEY_UP / TYPING)

key_press:
  type: object
  properties:
    action:
      type: string
      description: "What this call is for, one clause, in the user's language — 「打开聊天标题栏的更多菜单」. This is the card title and the anchor verify judges against."
    key:
      type: string
      description: Key name, e.g. enter, tab, escape, up, space, a.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
    - action
  additionalProperties: true

key_down:
  type: object
  properties:
    action:
      type: string
      description: "What this call is for, one clause, in the user's language — 「打开聊天标题栏的更多菜单」. This is the card title and the anchor verify judges against."
    key:
      type: string
      description: Key name to hold down until a later key_up.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
    - action
  additionalProperties: true

key_up:
  type: object
  properties:
    action:
      type: string
      description: "What this call is for, one clause, in the user's language — 「打开聊天标题栏的更多菜单」. This is the card title and the anchor verify judges against."
    key:
      type: string
      description: Key name to release.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
    - action
  additionalProperties: true

keyboard_type:
  type: object
  properties:
    action:
      type: string
      description: "What this call is for, one clause, in the user's language — 「打开聊天标题栏的更多菜单」. This is the card title and the anchor verify judges against."
    text:
      type: string
      description: Text to type into the focused widget with raw key events.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - text
    - action
  additionalProperties: true
