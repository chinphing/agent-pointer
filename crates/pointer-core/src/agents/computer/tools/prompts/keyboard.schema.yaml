# `action` 不在本文件声明：desktop 工具共有的这个字段由 tools/mod.rs 的
# inject_action_field 统一注入结构（type + required）。字段该写什么，权威在
# ../prompts/communication.md 的 `## Tool call shape`。
# keyboard.schema.yaml — flat keyboard tool schemas (PRESS / KEY_DOWN / KEY_UP / TYPING)

key_press:
  description: "Press and release a key, or a chord such as Cmd+S."
  type: object
  properties:
    key:
      type: string
      description: Key name, e.g. enter, tab, escape, up, space, a.
    wait:
      description: "Seconds to hold the next step back. Omit when the screen already shows the result."
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
  additionalProperties: false

key_down:
  description: "Hold a key down (key-down half of a manual chord or hold)."
  type: object
  properties:
    key:
      type: string
      description: Key name to hold down until a later key_up.
    wait:
      description: "Seconds to hold the next step back. Omit when the screen already shows the result."
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
  additionalProperties: false

key_up:
  description: "Release a held key (key-up half of a manual chord or hold)."
  type: object
  properties:
    key:
      type: string
      description: Key name to release.
    wait:
      description: "Seconds to hold the next step back. Omit when the screen already shows the result."
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
  additionalProperties: false

keyboard_type:
  description: "Type raw characters into whatever has focus."
  type: object
  properties:
    text:
      type: string
      description: Text to type into the focused widget with raw key events.
    wait:
      description: "Seconds to hold the next step back. Omit when the screen already shows the result."
      type: number
      minimum: 1
      maximum: 5
  required:
    - text
  additionalProperties: false
