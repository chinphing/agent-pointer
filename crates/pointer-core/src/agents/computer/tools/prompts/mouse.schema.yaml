mouse_scroll_current:
  type: object
  properties:
    target_desc:
      type: string
      description: "Optional. The panel or list body that must move; when given, the pointer is moved there first because wheel events only reach the window under it. See Writing target_desc for the shape."
    bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "Panel box, [x1, y1, x2, y2] in screenshot pixels. See Locating targets."
    goal:
      type: string
    action:
      type: string
    notches_x:
      type: integer
      minimum: -100
      maximum: 100
      description: >
        Horizontal scroll in wheel notches. Positive = right, negative = left.
        Omit when only vertical movement is needed.
    notches_y:
      type: integer
      minimum: -100
      maximum: 100
      description: >
        Vertical scroll in wheel notches. Positive = up, negative = down.
        Omit when only horizontal movement is needed. Most page scrolls need
        10-40; 100 jumps far. The distance one notch covers depends on the app —
        read the previous scroll's result to learn how far your last scroll went.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - goal
  additionalProperties: true

