modified_click_select_at:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    positions:
      type: array
      description: "One entry per target to select. Each is grounded and confirmed before any click happens."
      items:
        type: object
        properties:
          target_desc:
            type: string
            description: "What this target is (e.g. the first email / row A of the report). Required together with bbox."
          bbox:
            type: array
            items:
              type: number
            minItems: 4
            maxItems: 4
            description: "目标大概在 [x1, y1, x2, y2]，逻辑像素。通常用 locate_element 返回的 bbox。"
        required:
          - target_desc
          - bbox
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - positions
    - goal
  additionalProperties: true

