  <text x="676" y="712" text-anchor="middle" font-size="9.5" fill="#5F5E5A">Stream / non-stream · token stats</text>

  <rect x="810" y="664" width="246" height="52" rx="8" fill="white" stroke="#0F6E56" stroke-width="1"/>
  <text x="933" y="682" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">Runtime basics</text>
