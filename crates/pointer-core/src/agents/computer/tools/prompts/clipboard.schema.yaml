clipboard_read:
  type: object
  properties:
    action:
      type: string
      description: "What this call is for, one clause, in the user's language — 「打开聊天标题栏的更多菜单」. This is the card title and the anchor verify judges against."
  required:
    - action
  additionalProperties: true

clipboard_write:
  type: object
  properties:
    action:
      type: string
      description: "What this call is for, one clause, in the user's language — 「打开聊天标题栏的更多菜单」. This is the card title and the anchor verify judges against."
    text:
      type: string
  required:
    - text
    - action
  additionalProperties: true
