[package]
name = "pointer-app"
version = "0.1.0"
description = "Pointer AI desktop chat client"
authors = ["pointer"]
edition = "2021"

[lib]
name = "pointer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
pointer-core = { path = "../crates/pointer-core" }
pointer-channels = { path = "../crates/pointer-channels" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
log = "0.4"
env_logger = "0.11"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSView",
  "NSButton",
  "NSPanel",
  "NSImage",
  "NSImageView",
  "NSTextField",
  "NSScreen",
  "NSWorkspace",
  "NSDragging",
  "NSDraggingItem",
  "NSDraggingSession",
  "NSEvent",
  "NSPasteboard",
  "NSColor",
] }
objc2-foundation = "0.3"
