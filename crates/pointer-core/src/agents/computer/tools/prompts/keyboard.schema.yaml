# `action` 不在本文件声明：desktop 工具共有的这个字段由 tools/mod.rs 的
# inject_action_field 统一注入结构（type + required）。字段该写什么，权威在
# ../prompts/communication.md 的 `## Tool call shape`。
# keyboard.schema.yaml — flat keyboard tool schemas (PRESS / KEY_DOWN / KEY_UP / TYPING)

key_press:
  type: object
  properties:
    key:
      type: string
      description: Key name, e.g. enter, tab, escape, up, space, a.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
  additionalProperties: true

key_down:
  type: object
  properties:
    key:
      type: string
      description: Key name to hold down until a later key_up.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
  additionalProperties: true

key_up:
  type: object
  properties:
    key:
      type: string
      description: Key name to release.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - key
  additionalProperties: true

keyboard_type:
  type: object
  properties:
    text:
      type: string
      description: Text to type into the focused widget with raw key events.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - text
  additionalProperties: true
