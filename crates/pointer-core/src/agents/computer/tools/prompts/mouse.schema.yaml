mouse_click_at:
  type: object
  properties:
    target_desc:
      type: string
      description: "What you want to act on. Four parts: appearance + control type + screen position + anchor. Example: the blue rounded button on the right of the toolbar, white text 'Save', next to the 'Undo' button. Write it in the UI's language — never translate element names. Required together with bbox."
    bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "Roughly where the target is, [x1, y1, x2, y2] in logical pixels. Usually the bbox returned by locate_element. The tool re-grounds inside it and clicks the confirmed centre, so a loose box is fine — but it must be given together with target_desc."
    goal:
      type: string
    action:
      type: string
    button:
      type: string
      enum:
        - left
        - middle
        - right
      description: Mouse button. Default left.
    clicks:
      type: integer
      minimum: 1
      maximum: 2
      description: Number of clicks (1 or 2). Default 1.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - target_desc
    - bbox
    - goal
  additionalProperties: true

