<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" role="img">
  <title>Pointer · AI Workstation — Architecture</title>
  <desc>Pointer project architecture: Vue 3 frontend, Tauri desktop shell, Rust backend, LLM, IM channels</desc>

