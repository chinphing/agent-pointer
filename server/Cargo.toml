[package]
name = "pointer-server"
version.workspace = true
edition = "2021"

[dependencies]
env_logger = "0.11"
log = "0.4"
anyhow = "1"
base64 = "0.22"
async-stream = "0.3"
axum = { version = "0.7", features = ["macros", "multipart"] }
chrono = "0.4"

futures-util = "0.3"
pointer-core = { path = "../crates/pointer-core" }
pointer-channels = { path = "../crates/pointer-channels" }
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors"] }
urlencoding = "2"
