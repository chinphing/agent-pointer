# task_board.schema.yaml — 独立工具 schema（不含 method 枚举）
# 提示词正文仍留在 task_board.md 中共享。

task_board_init:
  type: object
  properties:
    goal:
      type: string
    global_context: {}
    items:
      description: >
        Milestone array (or JSON string of that array).
        Use field name items only. Each element needs id, title, status.
        Optional v3 fields: plan, checkpoint, validate_requirement,
        validate_results, extract_requirement, extract_results.
    expected_total:
      type: integer
      minimum: 1
    _conversation_id:
      type: string
  required: [goal]
  additionalProperties: true

task_board_replace:
  type: object
  properties:
    goal:
      type: string
    global_context: {}
    items: {}
    expected_total:
      type: integer
      minimum: 1
    _conversation_id:
      type: string
  required: [items]
  additionalProperties: true

task_board_patch:
  type: object
  properties:
    items: {}
    item_id:
      type: string
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_prune:
  type: object
  properties:
    ids:
      type: array
      items:
        type: string
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_finalize:
  type: object
  properties:
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_sync_finding:
  type: object
  properties:
    finding:
      type: string
    _conversation_id:
      type: string
  required: [finding]
  additionalProperties: true

task_board_check_deps:
  type: object
  properties:
    item_id:
      type: string
    _conversation_id:
      type: string
  required: [item_id]
  additionalProperties: true
