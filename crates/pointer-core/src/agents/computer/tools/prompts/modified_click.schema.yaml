# `action` 不在本文件声明：desktop 工具共有的这个字段由 tools/mod.rs 的
# inject_action_field 统一注入结构（type + required）。字段该写什么，权威在
# ../prompts/communication.md 的 `## Tool call shape`。
modified_click_select_at:
  type: object
  properties:
    positions:
      type: array
      description: "One entry per target to select. Each is grounded and confirmed before any click happens."
      items:
        type: object
        properties:
          target_desc:
            type: string
            description: "What this target is. Required together with bbox. See Writing target_desc for the shape."
          bbox:
            type: array
            items:
              type: number
            minItems: 4
            maxItems: 4
            description: "Target box, [x1, y1, x2, y2] in screenshot pixels. See Locating targets."
        required:
          - target_desc
          - bbox
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - positions
  additionalProperties: true

modified_click_range_select_at:
  type: object
  properties:
    positions:
      type: array
      description: "One entry per target to select. Each is grounded and confirmed before any click happens."
      items:
        type: object
        properties:
          target_desc:
            type: string
            description: "What this target is. Required together with bbox. See Writing target_desc for the shape."
          bbox:
            type: array
            items:
              type: number
            minItems: 4
            maxItems: 4
            description: "Target box, [x1, y1, x2, y2] in screenshot pixels. See Locating targets."
        required:
          - target_desc
          - bbox
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - positions
  additionalProperties: true
