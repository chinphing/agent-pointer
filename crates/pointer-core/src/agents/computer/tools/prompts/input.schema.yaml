# `action` 不在本文件声明：desktop 工具共有的这个字段由 tools/mod.rs 的
# inject_action_field 统一注入结构（type + required）。字段该写什么，权威在
# ../prompts/communication.md 的 `## Tool call shape`。
# input.schema.yaml — flat input tool schemas (no method enum)

input_at:
  description: "Type text into a located field: clicks it to focus, optionally clears it, types, optionally presses Enter."
  type: object
  properties:
    target_desc:
      type: string
      description: "Which control to type into. Required together with bbox. See Writing target_desc for the shape."
    bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "Field box, [x1, y1, x2, y2] in screenshot pixels. See Locating targets."
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - target_desc
    - bbox
    - text
  additionalProperties: true

input_focused:
  description: "Type into the field that already has focus — no click, no coordinates."
  type: object
  properties:
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - text
  additionalProperties: true
