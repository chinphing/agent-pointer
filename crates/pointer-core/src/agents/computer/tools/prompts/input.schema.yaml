# input.schema.yaml — flat input tool schemas (no method enum)

input_at:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    target_desc:
      type: string
      description: "Which control to type into. Four parts: appearance + control type + screen position + anchor. Example: 对话框顶部的搜索输入框，灰色边框，占位文字「搜索文件名」. Required together with bbox."
    bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "Roughly where the control is, [x1, y1, x2, y2] in logical pixels. Usually the bbox from locate_element. The tool re-grounds inside it before clicking into the field."
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    use_clipboard:
      type: boolean
      description: Default true. Writes text to clipboard and pastes via Cmd+V/Ctrl+V, bypassing IME. Set false to fall back to character-by-character keyboard events (enigo.text).
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - target_desc
    - bbox
    - text
    - goal
  additionalProperties: true

input_focused:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    use_clipboard:
      type: boolean
      description: Default true. Writes text to clipboard and pastes via Cmd+V/Ctrl+V, bypassing IME. Set false to fall back to character-by-character keyboard events (enigo.text).
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - text
    - goal
  additionalProperties: true
