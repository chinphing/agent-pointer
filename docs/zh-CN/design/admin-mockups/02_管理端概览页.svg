<svg viewBox="0 0 1040 640" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>管理端概览页</title>
  <rect width="1040" height="640" fill="#F7F7F8"/>
  <rect x="0" y="0" width="212" height="640" fill="#F2F2F4"/>
  <line x1="212" y1="0" x2="212" y2="640" stroke="#E5E5E8"/>
  <rect x="212" y="0" width="828" height="56" fill="#FFFFFF"/>
  <line x1="212" y1="56" x2="1040" y2="56" stroke="#E5E5E8"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
    <text x="20" y="34" font-size="13" font-weight="600" fill="#18181B">Pointer 管理端</text>
    <rect x="12" y="68" width="188" height="32" rx="8" fill="#E8E8EB"/>
    <text x="28" y="89" font-size="12" font-weight="600" fill="#18181B">概览</text>
    <text x="28" y="125" font-size="12" fill="#52525B">成员</text>
    <text x="28" y="161" font-size="12" fill="#52525B">角色与权限</text>
    <text x="28" y="197" font-size="12" fill="#52525B">资源</text>
    <text x="28" y="233" font-size="12" fill="#52525B">用量与配额</text>
    <text x="28" y="269" font-size="12" fill="#52525B">审计日志</text>
    <text x="28" y="305" font-size="12" fill="#52525B">系统</text>
    <circle cx="32" cy="596" r="13" fill="#D4D4D8"/>
    <text x="54" y="592" font-size="12" fill="#18181B">王国宏</text>
    <text x="54" y="608" font-size="10" fill="#71717A">超级管理员</text>
    <text x="236" y="34" font-size="15" font-weight="600" fill="#18181B">概览</text>
    <rect x="740" y="16" width="180" height="28" rx="8" fill="#F2F2F4"/>
    <text x="752" y="34" font-size="11" fill="#A1A1AA">搜索成员 / 资源</text>
    <circle cx="1000" cy="30" r="13" fill="#E8E8EB"/>
    <text x="1000" y="34" font-size="11" fill="#18181B" text-anchor="middle">王</text>
  </g>
  <g font-family="system-ui, 'PingFang SC', sans-serif">
    <rect x="236" y="76" width="182" height="88" rx="10" fill="#FFFFFF" stroke="#E5E5E8"/>
    <text x="256" y="104" font-size="11" fill="#71717A">成员</text>
    <text x="256" y="140" font-size="20" font-weight="600" fill="#18181B">128</text>
    <text x="256" y="156" font-size="10" fill="#71717A">本月新增 6</text>
    <rect x="434" y="76" width="182" height="88" rx="10" fill="#FFFFFF" stroke="#E5E5E8"/>
    <text x="454" y="104" font-size="11" fill="#71717A">本月 Token</text>
    <text x="454" y="140" font-size="20" font-weight="600" fill="#18181B">42.6M</text>
    <text x="454" y="156" font-size="10" fill="#71717A">较上月 +18%</text>
    <rect x="632" y="76" width="182" height="88" rx="10" fill="#FFFFFF" stroke="#E5E5E8"/>
    <text x="652" y="104" font-size="11" fill="#71717A">启用资源</text>
    <text x="652" y="140" font-size="20" font-weight="600" fill="#18181B">22</text>
    <text x="652" y="156" font-size="10" fill="#71717A">模型 6 · 技能 12 · 插件 4</text>
    <rect x="830" y="76" width="182" height="88" rx="10" fill="#FFFFFF" stroke="#E5E5E8"/>
