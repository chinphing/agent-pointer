mouse_scroll_current:
  type: object
  properties:
    target_desc:
      type: string
      description: "Optional. The panel or list body that must move. Only needed when the red crosshair is not already inside that panel — wheel events reach only the window under the pointer. See Writing target_desc for the shape."
    bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "Panel box, [x1, y1, x2, y2] in screenshot pixels. See Locating targets."
    goal:
      type: string
    action:
      type: string
      description: "This call's purpose as a visible effect — 「打开聊天标题栏的更多菜单」. Verify judges against this, not `goal`. One clause."
    notches_x:
      type: integer
      minimum: -1000
      maximum: 1000
      description: >
        Horizontal scroll in wheel notches. Positive = right, negative = left.
        Omit when only vertical movement is needed.
    notches_y:
      type: integer
      minimum: -1000
      maximum: 1000
      description: >
        Vertical scroll in wheel notches. Positive = up, negative = down.
        Omit when only horizontal movement is needed. Start with 40-60; the
        distance one notch covers depends on the app — read the previous
        scroll's result to learn how far your last scroll went, and send the
        count its `Scroll scale:` line names.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - goal
    - action
  additionalProperties: true

