name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # CI runs are one-shot: incremental artifacts only waste disk.
      CARGO_INCREMENTAL: 0
      # Full debuginfo makes the workspace target dir exceed the runner disk;
      # line tables still give file/line in panic backtraces.
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        # Runner images ship ~10-20GB of unused toolchains (dotnet, android,
        # ghc, docker images); the Rust workspace build needs that space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /opt/microsoft /opt/google || true
          docker system prune -af || true
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        # Keep in sync with the Linux deps in release.yml — xcap links
        # libgbm/EGL/DRM/Wayland, missing dev packages fail at link time.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libdrm-dev \
            libwayland-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --workspace

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
