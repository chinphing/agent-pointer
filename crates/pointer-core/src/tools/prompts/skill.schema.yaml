# skill.schema.yaml — 独立工具 schema（不含 method 枚举）
# 提示词正文仍留在 skill.md 中共享。

skill_load_instructions:
  type: object
  properties:
    skill_id:
      type: string
  required: [skill_id]
  additionalProperties: false

skill_read_resource:
  type: object
  properties:
    skill_id:
      type: string
    path:
      type: string
  required: [skill_id, path]
  additionalProperties: false

skill_patch_instructions:
  type: object
  properties:
    skill_id:
      type: string
    body:
      type: string
      description: Full SKILL.md markdown body (content after YAML frontmatter).
  required: [skill_id, body]
  additionalProperties: false

skill_import:
  type: object
  properties:
    path:
      type: string
      description: Path to a .zip file or skill directory (absolute or workspace-relative).
    auto_enable:
      type: boolean
      description: Enable imported skills for the current conversation. Defaults to true.
  required: [path]
  additionalProperties: false
