<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 350" width="100%" style="max-width:1300px" role="img">
  <title>Pointer 业务架构：业务系统 —UI/HTTP— Skill → 人工执行 → 自动执行</title>
  <desc>四个节点：业务系统、Skill、人工执行、自动执行。业务系统与 Skill 之间由 UI、HTTP 两个接口曲线相连；Skill → 人工执行 → 自动执行 为主流程。Pointer 是一个整体实体，对每个节点都发挥作用：开发业务系统、开发 Skill、提供运行环境——人工执行跑在员工电脑上，自动执行跑在服务器上。人工执行沉淀的经验回流 Skill，确定性规则固化回业务系统。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.3"/>
    </marker>
    <marker id="ar-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.3"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.4"/>
    </marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- Pointer：一个整体实体 -->
  <circle cx="650" cy="74" r="56" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="650" y="81" text-anchor="middle" font-size="20" font-weight="600" fill="#1E293B">Pointer</text>

  <!-- Pointer 到各节点的连线 -->
  <path d="M650 130 L650 152" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <path d="M170 152 L1130 152" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <path d="M170 152 L170 190" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#ar-s)"/>
  <path d="M510 152 L510 190" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#ar-s)"/>
  <path d="M820 152 L820 190" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#ar-s)"/>
  <path d="M1130 152 L1130 190" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#ar-s)"/>

  <!-- Pointer 在每个节点的作用 -->
  <text x="178" y="172" font-size="11.5" fill="#64748B">开发（程序员）</text>
  <text x="518" y="172" font-size="11.5" fill="#64748B">开发（业务骨干｜程序员）</text>
  <text x="828" y="172" font-size="11.5" fill="#64748B">环境（员工电脑）</text>
  <text x="1138" y="172" font-size="11.5" fill="#64748B">环境（服务器）</text>

  <!-- 四个节点 -->
  <rect x="60" y="190" width="220" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <text x="170" y="230" text-anchor="middle" font-size="16" font-weight="600" fill="#0C447C">业务系统</text>

  <rect x="400" y="190" width="220" height="68" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="510" y="230" text-anchor="middle" font-size="16" font-weight="600" fill="#085041">Skill</text>

  <rect x="710" y="190" width="220" height="68" rx="10" fill="#FDF0DC" stroke="#C08A2E" stroke-width="1.3"/>
  <text x="820" y="230" text-anchor="middle" font-size="16" font-weight="600" fill="#8A5A12">人工执行</text>

  <rect x="1020" y="190" width="220" height="68" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="1130" y="230" text-anchor="middle" font-size="16" font-weight="600" fill="#085041">自动执行</text>

  <!-- 主流程：Skill → 人工执行 → 自动执行 -->
  <path d="M620 224 L710 224" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M930 224 L1020 224" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- 两个接口：UI / HTTP（业务系统一侧分叉，Skill 一侧收回，曲线） -->
  <path d="M280 224 C310 197 370 197 400 224" stroke="#5F5E5A" stroke-width="1.5" fill="none"/>
  <path d="M280 224 C310 251 370 251 400 224" stroke="#5F5E5A" stroke-width="1.5" fill="none"/>

  <circle cx="340" cy="204" r="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
  <text x="340" y="208" text-anchor="middle" font-size="10.5" fill="#475569">UI</text>
  <circle cx="340" cy="244" r="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
  <text x="340" y="248" text-anchor="middle" font-size="10.5" fill="#475569">HTTP</text>

  <!-- 回馈：人工执行 → Skill（经验沉淀） -->
  <path d="M780 258 L780 290 L510 290 L510 258" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar-g)"/>
  <text x="645" y="280" text-anchor="middle" font-size="11.5" fill="#0F6E56">经验沉淀</text>

  <!-- 回馈：人工执行 → 业务系统（规则固化） -->
  <path d="M860 258 L860 322 Q860 330 852 330 L178 330 Q170 330 170 322 L170 258" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar-b)"/>
  <text x="515" y="320" text-anchor="middle" font-size="11.5" fill="#185FA5">规则固化</text>
</svg>
