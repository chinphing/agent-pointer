  <rect x="48" y="410" width="90" height="22" rx="4" fill="white" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="93" y="425" text-anchor="middle" font-size="9.5" fill="#333">channel_monitor</text>
  <rect x="150" y="410" width="90" height="22" rx="4" fill="white" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="195" y="425" text-anchor="middle" font-size="9.5" fill="#333">provider.rs</text>
  <rect x="252" y="410" width="82" height="22" rx="4" fill="white" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="293" y="425" text-anchor="middle" font-size="9.5" fill="#333">updater</text>

  <rect x="390" y="322" width="320" height="120" rx="12" fill="#FFF2E6" stroke="#C4791D" stroke-width="1.5"/>
