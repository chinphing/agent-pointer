  <rect x="680" y="872" width="240" height="95" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="800" y="898" text-anchor="middle" font-size="13" font-weight="700" fill="#0C447C">External LLM</text>
