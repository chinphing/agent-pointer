mouse_drag_from_to_at:
  type: object
  properties:
    from_target_desc:
      type: string
      description: "What the drag grabs. Four parts: appearance + control type + screen position + anchor. Example: report.pdf icon on the desktop, right of the Trash. Required together with from_bbox."
    from_bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "Roughly where the grab point is, [x1, y1, x2, y2] in logical pixels. Usually the bbox from locate_element."
    to_target_desc:
      type: string
      description: "Where the drag drops it. Four parts: appearance + control type + screen position + anchor. Example: Trash icon at the bottom right of the Dock. Required together with to_bbox."
    to_bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "Roughly where the drop point is, [x1, y1, x2, y2] in logical pixels. Usually the bbox from locate_element."
    goal:
      type: string
    action:
      type: string
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - from_target_desc
    - from_bbox
    - to_target_desc
    - to_bbox
    - goal
  additionalProperties: true
