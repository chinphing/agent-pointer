mouse_scroll_current:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    dx:
      type: integer
      description: >
        Horizontal scroll in screen pixels. Positive scrolls right,
        negative left. Omit when only vertical movement is needed.
    dy:
      type: integer
      description: >
        Vertical scroll in screen pixels. Positive scrolls up,
        negative down. Omit when only horizontal movement is needed.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - goal
  additionalProperties: true

