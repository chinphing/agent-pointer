[package]
name = "pointer-server"
version = "0.1.0"
edition = "2021"

[dependencies]
env_logger = "0.11"
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.7", features = ["macros"] }

futures-util = "0.3"
pointer-core = { path = "../crates/pointer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
