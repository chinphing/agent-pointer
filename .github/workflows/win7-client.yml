# Windows 7 client build (experimental).
#
# Why this exists:
# The regular release builds target `x86_64-pc-windows-msvc`. Since Rust 1.78
# that target's std links Windows 8+ futex APIs
# (`api-ms-win-core-synch-l1-2-0.dll`), so the produced binary cannot start on
# Windows 7 — it fails with a missing-DLL error, and once the DLL is forced in
# it crashes with 0xc0000005 (access violation).
#
# This workflow builds the same client against the Rust
# `x86_64-win7-windows-msvc` target (Tier 3), whose std uses Windows 7 era
# synchronisation primitives. Std is compiled from source via `-Z build-std`.
#
# Windows only: the Win7 target exists solely for Windows, so no macOS/Linux
# jobs here.
name: Win7 Client

on:
  workflow_dispatch:
  push:
    branches:
      - feat/win7-build

permissions:
  contents: read

concurrency:
  group: win7-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win7:
    name: windows-win7
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      WIN7_TARGET: x86_64-win7-windows-msvc
      # rust-toolchain.toml pins `channel = "stable"`, which would override the
      # nightly install and make cargo reject `-Z build-std`.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # `tauri build` would run this via beforeBuildCommand, but the Tauri CLI
      # is not used for the compile step below (it rejects Tier 3 targets), so
      # build the frontend explicitly.
      - name: Build frontend
        run: npm run build

      # build-std requires the nightly toolchain plus the rust-src component.
      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # `cl.exe` is not on PATH on windows-latest until the MSVC environment is
      # loaded; several dependencies (aws-lc-sys) compile C code.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Git for Windows ships a POSIX `link.exe` (a hardlink utility). When it
      # shadows MSVC's linker, rustc reports "link.exe returned an unexpected
      # error" with no further output.
      - name: Make sure MSVC linker wins
        run: |
          echo '--- link.exe resolution ---'
          which -a link.exe || true
          echo '--- cl.exe resolution ---'
          which -a cl.exe || true
          GIT_LINK="/c/Program Files/Git/usr/bin/link.exe"
          if [ -f "$GIT_LINK" ]; then
            mv "$GIT_LINK" "$GIT_LINK.disabled"
            echo "disabled $GIT_LINK"
          fi
          echo '--- after ---'
          which -a link.exe || true

      # The target triple carries `win7` in the vendor position, so
      # `cfg(target_vendor = "pc")` is false and crates that gate Windows code
      # on the vendor (e.g. `ctor`) emit "not supported on the current target".
      # rustc accepts extra values for the same cfg key, so adding `pc` makes
      # the target look like a regular Windows target without patching crates.
      # Scoped to this target only: applying it to the host would mislabel the
      # build scripts.
      - name: Mark the target as a Windows vendor
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.x86_64-win7-windows-msvc]
          rustflags = [
            '-A', 'explicit_builtin_cfgs_in_flags',
            '--cfg', 'target_vendor="pc"',
          ]
          EOF
          cat .cargo/config.toml

      # The `cc` crate does not know this custom triple, so point it at MSVC
      # explicitly. `cl.exe` ships with the VS toolchain on windows-latest.
      - name: Build client binary for Windows 7
        env:
          CC_x86_64_win7_windows_msvc: cl.exe
          CXX_x86_64_win7_windows_msvc: cl.exe
        run: |
          set +e
          cargo build --release -p pointer-app \
            -Z build-std=std,panic_abort \
            --target "$WIN7_TARGET" > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::linker / compiler error detail"
            grep -n -A40 -m1 'error: linking with' build.log \
              || grep -n -A25 -m1 'error\[' build.log \
              || tail -60 build.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -5 build.log

      # The Tauri CLI refuses any target missing from `rustup target list`,
      # and Tier 3 targets are never distributed by rustup. Creating the
      # sysroot directory makes the target show up as installed so the
      # bundler accepts it; std itself still comes from build-std.
      - name: Register target with rustup for the bundler
        run: |
          SYSROOT="$(rustc --print sysroot)"
          mkdir -p "$SYSROOT/lib/rustlib/$WIN7_TARGET"
          rustup target list --installed

      - name: Package NSIS installer
        continue-on-error: true
        env:
          CC_x86_64_win7_windows_msvc: cl.exe
          CXX_x86_64_win7_windows_msvc: cl.exe
        run: |
          npm run tauri:build -- --target "$WIN7_TARGET" --bundles nsis

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pointer-win7-client
          path: |
            target/x86_64-win7-windows-msvc/release/pointer-app.exe
            target/x86_64-win7-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
