# input.schema.yaml — flat input tool schemas (no method enum)

input_at:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    target_desc:
      type: string
      description: "要输入到哪个控件。写全四要素：外观特征 + 控件类型 + 屏幕位置 + 周边锚点。例：顶部导航栏左侧的搜索输入框，橙色边框，占位文字「输入股票代码」。必须和 bbox 一起给。"
    bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "控件大概在 [x1, y1, x2, y2]，逻辑像素。通常直接用 locate_element 返回的 bbox。工具会以此为搜索种子重新定位确认，再点进去输入。"
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    use_clipboard:
      type: boolean
      description: Default true. Writes text to clipboard and pastes via Cmd+V/Ctrl+V, bypassing IME. Set false to fall back to character-by-character keyboard events (enigo.text).
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - target_desc
    - bbox
    - text
    - goal
  additionalProperties: true

input_focused:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    use_clipboard:
      type: boolean
      description: Default true. Writes text to clipboard and pastes via Cmd+V/Ctrl+V, bypassing IME. Set false to fall back to character-by-character keyboard events (enigo.text).
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - text
    - goal
  additionalProperties: true
