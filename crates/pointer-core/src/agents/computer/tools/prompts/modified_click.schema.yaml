modified_click_select_at:
  type: object
  properties:
    goal:
      type: string
    action:
      type: string
    positions:
      type: array
      description: "One entry per target to select. Each is grounded and confirmed before any click happens."
      items:
        type: object
        properties:
          target_desc:
            type: string
            description: "What this target is. Four parts: appearance + control type + screen position + anchor. Example: first row of the report table, below the header row. Write it in the UI's language — never translate element names. Required together with bbox."
          bbox:
            type: array
            items:
              type: number
            minItems: 4
            maxItems: 4
            description: "Roughly where the target is, [x1, y1, x2, y2] in logical pixels. Usually the bbox from locate_element."
        required:
          - target_desc
          - bbox
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - positions
    - goal
  additionalProperties: true

