# input.schema.yaml — flat input tool schemas (no method enum)

input_at:
  type: object
  properties:
    action:
      type: string
      description: "What this call is for, one clause, in the user's language — 「打开聊天标题栏的更多菜单」. This is the card title and the anchor verify judges against."
    target_desc:
      type: string
      description: "Which control to type into. Required together with bbox. See Writing target_desc for the shape."
    bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: "Field box, [x1, y1, x2, y2] in screenshot pixels. See Locating targets."
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - target_desc
    - bbox
    - text
    - action
  additionalProperties: true

input_focused:
  type: object
  properties:
    action:
      type: string
      description: "What this call is for, one clause, in the user's language — 「打开聊天标题栏的更多菜单」. This is the card title and the anchor verify judges against."
    text:
      type: string
    clear_first:
      type: boolean
    auto_enter:
      type: boolean
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - text
    - action
  additionalProperties: true
