[package]
name = "pointer-core"
version.workspace = true
edition = "2021"

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
bytes = "1"
chrono = "0.4"
cron = "0.15"
dirs = "5"
env_logger = "0.11"
flexi_logger = "0.29"
futures-util = "0.3"
log = "0.4"
parking_lot = "0.12"
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }
rusqlite = { version = "0.32", features = ["bundled"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
partial-json-fixer = "0.5"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "process"] }
enigo = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"
base64 = "0.22"
xcap = { version = "0.9", features = ["wgc"] }

tokio-util = "0.7"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v5"] }
subtle = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tempfile = "3"
portable-pty = "0.9"
http = "1"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
walkdir = "2"
regex = "1"
similar = "2"
async-trait = "0.1"
arboard = "3"
calamine = "0.26"
csv = "1.3"
rust_xlsxwriter = "0.79"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
hkdf = "0.12"
machine-uid = "0.5"
ossify = "0.4.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
pdfium-render = { version = "0.8.37", default-features = false, features = ["image_025", "pdfium_latest", "thread_safe"] }
pdfium-auto = "0.3"
# OTLP/HTTP protobuf encoding for the OtlpExporter (Phoenix rejects JSON with 415).
# Trimmed: prost-generated message types only (gen-tonic-messages) + trace signal
# types; no tonic transport, no metrics/logs. prost 0.14 matches the version
# opentelemetry-proto 0.32 generates against.
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"

[dev-dependencies]
anyhow = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[build-dependencies]
cc = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Same Quartz coordinate space as xcap (`CGDisplayBounds` / `CGGetDisplaysWithPoint`). Enigo's macOS
# `location()` mixes NSEvent points with the main display's physical pixel height and can miss every display.
core-foundation = "0.9"
core-graphics = "0.23"
# Enigo uses TIS / event APIs that must run on the main thread; dispatch tool work there from Tokio workers.
dispatch = "0.2"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
