# task_board.schema.yaml — flat tool argument shapes (v4)
# Narrative guidance lives in task_board.md.

task_board_init:
  type: object
  properties:
    goal:
      type: string
    context:
      type: string
    constraint:
      type: string
    done_when:
      type: string
    global_milestones:
      type: array
      description: Exactly one global row object in an array (or JSON string of array).
      items:
        type: object
    item_milestones:
      type: array
      description: Per-work-item SOP template array (Type2 only).
      items:
        type: object
    work_items:
      description: Inline work item drafts (Type2 enumerated init).
    work_items_source:
      type: string
      description: >
        Path or media ref to seed work_items from CSV/JSONL/XLSX (Type2).
        Accepts localPath, pointer-media://…, or storage rel (same as general agent media).
    work_item_mode:
      type: string
      enum: [enumerated, dynamic]
    expected_total:
      type: integer
      minimum: 1
    dynamic_quota:
      type: integer
      minimum: 1
    global_context: {}
    items:
      description: Legacy alias for global_milestones.
    _conversation_id:
      type: string
  required: [goal]
  additionalProperties: true

task_board_replace:
  type: object
  properties:
    item_milestones:
      description: Full item SOP template array (execution only).
    _conversation_id:
      type: string
  required: [item_milestones]
  additionalProperties: false

task_board_patch:
  type: object
  properties:
    global_milestones:
      type: array
      description: Exactly one global row object in an array (or JSON string of array).
      items:
        type: object
    milestones:
      type: array
      description: Exactly one item_milestone row object in an array (or JSON string of array).
      items:
        type: object
    work_item_delta:
      type: object
      description: One work_item update object (not a string). Host also accepts a JSON string for compatibility.
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, in_progress, done, failed, cancelled]
        result_summary:
          type: string
        result_ref:
          type: string
        error_message:
          type: string
      required: [id]
      additionalProperties: false
    work_item_claim:
      type: object
      description: Dynamic mode — claim one runtime target (object, not a string).
      properties:
        target_key:
          type: string
        title:
          type: string
        payload:
          type: object
          description: Optional key-value fields for the claimed target.
          additionalProperties: true
        status:
          type: string
      required: [target_key]
      additionalProperties: true
    items:
      description: Legacy flat row (id + status); prefer global_milestones or milestones.
    item_id:
      type: string
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_prune:
  type: object
  properties:
    ids:
      type: array
      items:
        type: string
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_finalize:
  type: object
  properties:
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_sync_finding:
  type: object
  properties:
    finding:
      type: string
    _conversation_id:
      type: string
  required: [finding]
  additionalProperties: true

task_board_check_deps:
  type: object
  properties:
    item_id:
      type: string
    _conversation_id:
      type: string
  required: [item_id]
  additionalProperties: true
