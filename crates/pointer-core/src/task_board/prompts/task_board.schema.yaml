# task_board.schema.yaml — flat tool argument shapes (v4)
# Narrative guidance lives in task_board.md.

task_board_init:
  type: object
  properties:
    goal:
      type: string
    context:
      type: string
    constraints:
      type: string
      description: Task-level binding rules (short bullets; one or more lines).
    done_when:
      type: string
    global_milestones:
      type: array
      description: >
        Milestone rows. Linear: 3–8 steps (m1…). Loop: g_plan, wi_* item rows, g_deliver.
        Enumerated loop: include every wi_* row here. Dynamic loop: g_plan + g_deliver only; host seeds wi_* from dynamic_quota.
      items:
        type: object
        properties:
          id:
            type: string
          title:
            type: string
          status:
            type: string
          rules:
            type: string
            description: User/session normative rules for this milestone.
          constraints:
            type: string
            description: Short binding bullets (one or more lines).
          done_when:
            type: string
          plan:
            type: string
          delivery_format:
            type: string
        required: [id, title, status]
        additionalProperties: true
    dynamic_quota:
      type: integer
      minimum: 1
      description: >
        Dynamic loop — host seeds wi_1…wi_N between g_plan and g_deliver with placeholder titles (#1…#N).
        Use when only the count is known at init; patch each row title before exec when the target id appears.
        When targets are already known, put explicit wi_* rows in global_milestones instead.
    global_context: {}
    _conversation_id:
      type: string
  required: [goal]
  additionalProperties: true

task_board_replace:
  type: object
  properties:
    global_milestones:
      type: array
      description: Full global_milestones table (linear or loop rows).
      items:
        type: object
        properties:
          id:
            type: string
          title:
            type: string
          status:
            type: string
          rules:
            type: string
          constraints:
            type: string
          done_when:
            type: string
          plan:
            type: string
          delivery_format:
            type: string
        required: [id, title, status]
        additionalProperties: true
    _conversation_id:
      type: string
  required: [global_milestones]
  additionalProperties: false

task_board_patch:
  type: object
  description: Update one visible milestone row from inject via milestones[].
  properties:
    milestones:
      type: array
      description: >
        One milestone row from inject (linear step, loop item wi_*, or g_deliver).
      items:
        type: object
        properties:
          id:
            type: string
          status:
            type: string
          remark:
            type: string
          title:
            type: string
          plan:
            type: string
        required: [id, status]
        additionalProperties: true
    global_context: {}
    _conversation_id:
      type: string
  required: [milestones]
  additionalProperties: false

task_board_prune:
  type: object
  properties:
    ids:
      type: array
      items:
        type: string
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_finalize:
  type: object
  properties:
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_abandon:
  type: object
  properties:
    _conversation_id:
      type: string
  required: []
  additionalProperties: true

task_board_sync_finding:
  type: object
  properties:
    finding:
      type: string
    _conversation_id:
      type: string
  required: [finding]
  additionalProperties: true

task_board_check_deps:
  type: object
  properties:
    item_id:
      type: string
    _conversation_id:
      type: string
  required: [item_id]
  additionalProperties: true
