list_apps:
  type: object
  properties:
    action:
      type: string
      description: "What this call is for, one clause, in the user's language — 「打开聊天标题栏的更多菜单」. This is the card title and the anchor verify judges against."
    include_all:
      type: boolean
      default: false
      description: Omit or false on the first list_apps call (running + 14-day recent). Set true only on a second list_apps retry when the target app was not in the first result.
  required:
    - action
  additionalProperties: true
