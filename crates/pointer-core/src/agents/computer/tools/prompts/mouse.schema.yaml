mouse_click_at:
  type: object
  properties:
    description:
      type: string
      description: "要点的东西，用自然语言描述（例：搜索框 / 右上角的关闭按钮 / 数据标签页）。给了它就不用给 x/y——工具会先定位再点。定位失败会直接报错，不会瞎点。"
    goal:
      type: string
    action:
      type: string
    x:
      type: number
      description: Logical screen pixel X. For a visible target, take it from `locate_element`; never estimate.
    y:
      type: number
      description: Logical screen pixel Y. For a visible target, take it from `locate_element`; never estimate.
    button:
      type: string
      enum:
        - left
        - middle
        - right
      description: Mouse button. Default left.
    clicks:
      type: integer
      minimum: 1
      maximum: 2
      description: Number of clicks (1 or 2). Default 1.
    wait:
      type: number
      minimum: 1
      maximum: 5
  required:
    - goal
  additionalProperties: true

